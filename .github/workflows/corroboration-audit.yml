name: Corroboration audit: rules, amounts and grant outcomes
on:
  workflow_dispatch:
  push:
    paths:
      - "src/observatory/corroboration.py"
      - "src/observatory/integrity.py"
      - ".github/workflows/corroboration-audit.yml"
permissions:
  contents: read
jobs:
  corroborate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pdfplumber==0.11.7"
      - name: Validate offline controls
        run: python -m unittest discover -s tests -v
      - name: Refresh municipal source observations
        run: python -m src.observatory.integrity --live --out local_results/integrity > integrity-collector.log
      - name: Recheck primary policy and decision PDFs
        run: python -m src.observatory.corroboration --live --source-dir local_results/integrity --out local_results/corroboration > corroboration-run.log
      - name: Display only neutral verified audit checkpoints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("local_results/corroboration/audit_status.json").read_text())
          for k in ("mississauga_source_rows_confirmed","toronto_arithmetic_reconciled",
                    "brampton_2025_award_rollup_confirmed",
                    "verified_actual_payments_by_contract","verified_grant_project_closeouts",
                    "verified_fraud_findings"):
              print(k,x[k])
          for item in x["source_audit"]:
              print("SOURCE",item["status"],item["source_url"],item.get("error",""))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corroboration-audit-outputs-not-allegations
          path: |
            local_results/corroboration/
            local_results/integrity/source_status.json
          retention-days: 7
          if-no-files-found: warn
