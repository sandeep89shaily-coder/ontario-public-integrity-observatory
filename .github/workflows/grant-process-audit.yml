name: 'Brampton grant selection and receipts evidence audit'
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/observatory/grant_process_audit.py'
      - 'tests/test_grant_process_audit.py'
      - '.github/workflows/grant-process-audit.yml'
permissions:
  contents: read
jobs:
  grant-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pdfplumber==0.11.7'
      - name: Test all public-evidence guardrails
        run: python -m unittest discover -s tests -v
      - name: Refresh Brampton's public award lists
        run: python -m src.observatory.grant_research --live --out local_results/grants > grant-pilot-source.log
      - name: Generate process and authenticity evidence-gaps from real public awards
        run: python -m src.observatory.grant_process_audit --grants local_results/grants/grants_approved.json --out local_results/process_audit --year 2025 --per-stream 2
      - name: Show evidence completeness; never print unverified allegations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('local_results/process_audit/AUDIT_STATUS.json').read_text())
          for key in ('sample_size','stage_status_counts','original_score_sheets_received','actual_city_payment_ledgers_received','original_invoice_and_proof_of_payment_pairs_received','independently_verified_project_outcomes','confirmed_fraud_or_recipient_ineligibility'):
              print(key, x[key])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grants-process-public-evidence-gaps-only
          path: local_results/process_audit/
          retention-days: 7
          if-no-files-found: warn
